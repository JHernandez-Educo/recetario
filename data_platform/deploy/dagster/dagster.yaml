storage:
  postgres:
    postgres_db:
      hostname: postgres
      port: 5432
      db_name: dagster
      username: {env: POSTGRES_USER}
      password: {env: POSTGRES_PASSWORD}
      scheme: postgresql+psycopg2   # SQLAlchemy 2.1 defaults to psycopg 3; dagster-postgres uses psycopg2

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 1

run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher

telemetry:
  enabled: false
